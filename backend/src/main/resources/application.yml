
spring:
  application:
    name: inventario-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  web:
    locale: es
    locale-resolver: fixed
  mvc:
    apiversion:
      use:
        header: X-API-Version
      required: true
      supported: 1, 2
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  cache:
    type: simple

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/inventario_db}
