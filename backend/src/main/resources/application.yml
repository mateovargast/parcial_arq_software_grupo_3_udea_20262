
spring:
  application:
    name: inventario-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  web:
    locale: es
    locale-resolver: fixed
  mvc:
    apiversion:
      use:
        header: X-API-Version
      required: true
      supported: 1, 2
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  cache:
    ttl: ${CACHE_TTL:10m}

springdoc:
  default-produces-media-type: application/hal+json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  cache:
    type: simple
    cache-names: inventario, resumen-inventario

management:
  health:
    redis:
      enabled: false

logging:
  level:
    org.springframework.cache: TRACE

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/inventario_db}
  cache:
    type: redis
    redis:
      enable-statistics: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
