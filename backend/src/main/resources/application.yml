
spring:
  application:
    name: inventario-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  web:
    locale: es
    locale-resolver: fixed
  mvc:
    apiversion:
      use:
        header: X-API-Version
      required: false
      supported: 1, 2
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  cache:
    ttl: ${CACHE_TTL:10m}
  dashboard-cache:
    ttl: ${DASHBOARD_CACHE_TTL:60s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  default-produces-media-type: application/hal+json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

info:
  app:
    name: ${spring.application.name}
    description: '@project.description@'
    version: '@project.version@'

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  cache:
    type: simple
    cache-names: inventario, resumen-inventario, dashboardSummary

management:
  health:
    redis:
      enabled: false

logging:
  level:
    org.springframework.cache: TRACE

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/inventario_db}
  cache:
    type: redis
    redis:
      enable-statistics: true
      time-to-live: ${CACHE_TTL:10m}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
